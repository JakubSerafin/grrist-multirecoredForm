<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rozliczenie liczników</title>

    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />

    <style>
        .meter-block {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .meter-block-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 16px;
            border-bottom: 1px solid var(--border);
        }

        .meter-block-icon {
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .meter-block-title {
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .meter-block-body {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .meter-row {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }

        .meter-row:last-child {
            border-bottom: none;
        }

        .meter-row-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
            min-width: 120px;
        }

        .meter-row select {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 2px 0;
            outline: none;
            transition: border-color 0.2s;
            cursor: pointer;
        }

        .meter-row select:focus {
            border-bottom-color: var(--accent);
        }

        .meter-row select option {
            background: var(--surface2);
        }

        .meters {
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <div class="header-icon">🧾</div>
            <h1>Rozliczenie<small>Wybierz cennik i poprzednie rozliczenie</small></h1>
        </div>
        <div class="divider"></div>

        <!-- Date -->
        <div class="field-group">
            <label><span class="label-dot" style="background:#6c63ff;"></span>Data rozliczenia</label>
            <input type="date" id="data" />
        </div>

        <!-- Per-type selectors — populated dynamically -->
        <div class="field-group">
            <label><span class="label-dot" style="background:var(--muted);"></span>Konfiguracja</label>
            <div class="meters" id="meters-container">
                <!-- rendered by JS based on Stan_licznika for selected month -->
            </div>
        </div>

        <button class="btn-save" id="btn-save" onclick="saveRozliczenia()">
            <span class="btn-icon">💾</span>
            <span class="btn-text">Zapisz rozliczenie</span>
            <div class="spinner"></div>
        </button>
        <div id="status"></div>
    </div>
    <div id="toast"></div>

    <script>
        // ─── State ───────────────────────────────────────────────────────────────────
        let cennikData = null;
        let rozlData = null;
        let mediaData = null;
        let stanData = null;

        const TYPE_META = {
            'Gaz':  { icon: '🔥', color: 'var(--gas)' },
            'Prąd': { icon: '⚡', color: 'var(--electric)' },
            'Woda': { icon: '💧', color: 'var(--water)' },
        };

        // ─── Grist Bootstrap ─────────────────────────────────────────────────────────
        grist.ready({ requiredAccess: 'full' });

        let _loaded = false;
        grist.onRecords(async function () { await loadAll(); });

        grist.onOptions(async function () {
            if (!_loaded) {
                _loaded = true;
                document.getElementById('data').value = todayISO();
                document.getElementById('data').addEventListener('change', renderForm);
                await loadAll();
            }
        });

        // ─── Load ────────────────────────────────────────────────────────────────────
        async function loadAll() {
            try {
                [cennikData, rozlData, mediaData, stanData] = await Promise.all([
                    grist.docApi.fetchTable('Cennik'),
                    grist.docApi.fetchTable('Rozliczenia'),
                    grist.docApi.fetchTable('Media'),
                    grist.docApi.fetchTable('Stan_licznika'),
                ]);
                renderForm();
            } catch (e) {
                showStatus('❌ Błąd pobierania danych: ' + (e.message || e), 'error');
            }
        }

        // ─── Render dynamic blocks ────────────────────────────────────────────────────
        function renderForm() {
            const dateVal = document.getElementById('data').value;
            const container = document.getElementById('meters-container');
            container.innerHTML = '';

            if (!dateVal || !stanData || !mediaData) return;

            const [y, m] = dateVal.split('-').map(Number);
            const gristDate = isoToGristDate(dateVal);

            // Collect types that have at least one Stan_licznika record in this month
            const typesThisMonth = new Set();
            stanData.id.forEach((_, i) => {
                const d = new Date(stanData.Data[i] * 1000);
                if (d.getUTCFullYear() === y && (d.getUTCMonth() + 1) === m) {
                    typesThisMonth.add(mediaTyp(stanData.Typ_licznika[i]));
                }
            });

            if (typesThisMonth.size === 0) {
                container.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;padding:12px 0;">Brak odczytów liczników dla wybranego miesiąca.</div>';
                return;
            }

            // Render one block per type found
            for (const typ of typesThisMonth) {
                if (!typ) continue;
                const meta = TYPE_META[typ] || { icon: '📊', color: 'var(--muted)' };
                const prefix = typ.toLowerCase().replace('ą', 'a').replace('ó', 'o');

                const block = document.createElement('div');
                block.className = 'meter-block';
                block.dataset.typ = typ;
                block.innerHTML = `
                    <div class="meter-block-header">
                        <span class="meter-block-icon">${meta.icon}</span>
                        <span class="meter-block-title" style="color:${meta.color};">${typ}</span>
                    </div>
                    <div class="meter-block-body">
                        <div class="meter-row">
                            <span class="meter-row-label">Cennik</span>
                            <select id="${prefix}-taryfa"><option value="">— wybierz —</option></select>
                        </div>
                        <div class="meter-row">
                            <span class="meter-row-label">Poprz. rozliczenie</span>
                            <select id="${prefix}-prev"><option value="">— brak / pierwsze —</option></select>
                        </div>
                    </div>`;
                container.appendChild(block);

                // Fill cennik options
                const cennikSel = document.getElementById(prefix + '-taryfa');
                tableRows(cennikData)
                    .filter(r => mediaTyp(r.Typ) === typ)
                    .sort((a, b) => b.Data_obowiazywania_od - a.Data_obowiazywania_od)
                    .forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r.id;
                        opt.textContent = r.Nazwa || `${typ} ${gristDateToISO(r.Data_obowiazywania_od)}`;
                        cennikSel.appendChild(opt);
                    });

                // Fill poprzednie rozliczenie options
                const prevSel = document.getElementById(prefix + '-prev');
                tableRows(rozlData)
                    .filter(r => {
                        const t = typeof r.Typ === 'string' ? r.Typ : mediaTyp(r.Typ);
                        return t === typ;
                    })
                    .sort((a, b) => b.Data_rozliczenia - a.Data_rozliczenia)
                    .forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r.id;
                        opt.textContent = r.Nazwa_roliczenia || gristDateToISO(r.Data_rozliczenia);
                        prevSel.appendChild(opt);
                    });

                // Auto-select best defaults
                const bestCennik = tableRows(cennikData)
                    .filter(r => mediaTyp(r.Typ) === typ && r.Data_obowiazywania_od <= gristDate)
                    .sort((a, b) => b.Data_obowiazywania_od - a.Data_obowiazywania_od)[0];
                if (bestCennik) cennikSel.value = String(bestCennik.id);

                const bestPrev = tableRows(rozlData)
                    .filter(r => {
                        const t = typeof r.Typ === 'string' ? r.Typ : mediaTyp(r.Typ);
                        return t === typ && r.Data_rozliczenia < gristDate;
                    })
                    .sort((a, b) => b.Data_rozliczenia - a.Data_rozliczenia)[0];
                if (bestPrev) prevSel.value = String(bestPrev.id);
            }
        }

        // ─── Save ─────────────────────────────────────────────────────────────────────
        async function saveRozliczenia() {
            const btn = document.getElementById('btn-save');
            const dateVal = document.getElementById('data').value;
            if (!dateVal) { showStatus('⚠️ Wybierz datę.', 'error'); return; }

            const gristDate = isoToGristDate(dateVal);
            const actions = [];

            const blocks = document.querySelectorAll('#meters-container .meter-block');
            for (const block of blocks) {
                const typ = block.dataset.typ;
                const prefix = typ.toLowerCase().replace('ą', 'a').replace('ó', 'o');
                const taryfaId = parseInt(document.getElementById(prefix + '-taryfa').value);
                if (!taryfaId) { showStatus(`⚠️ Wybierz cennik dla: ${typ}`, 'error'); return; }

                const row = { Data_rozliczenia: gristDate, uzyta_taryfa: taryfaId };
                const prevId = parseInt(document.getElementById(prefix + '-prev').value);
                if (prevId) row.Poprzednie_rozliczenie = prevId;

                actions.push(['AddRecord', 'Rozliczenia', null, row]);
            }

            if (actions.length === 0) { showStatus('⚠️ Brak mediów do zapisania.', 'error'); return; }

            btn.classList.add('loading'); btn.disabled = true;
            showStatus('', '');

            try {
                await grist.docApi.applyUserActions(actions);
                showStatus(`✅ Zapisano ${actions.length} rozliczeni${actions.length === 1 ? 'e' : 'a'}.`, 'success');
                showToast('✅ Rozliczenie zapisane', 'success');
                await loadAll();
            } catch (err) {
                showStatus('❌ Błąd: ' + (err.message || err), 'error');
                showToast('❌ Błąd zapisu', 'error');
            } finally {
                btn.classList.remove('loading'); btn.disabled = false;
            }
        }

        // ─── Utilities ────────────────────────────────────────────────────────────────
        function tableRows(table) {
            if (!table || !table.id) return [];
            return table.id.map((id, i) => {
                const r = { id };
                for (const [k, arr] of Object.entries(table)) if (k !== 'id') r[k] = arr[i];
                return r;
            });
        }

        function mediaTyp(id) {
            if (!mediaData) return '';
            const i = mediaData.id.indexOf(id);
            return i >= 0 ? mediaData.Typ[i] : '';
        }

        function todayISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function isoToGristDate(s) {
            const [y, m, d] = s.split('-').map(Number);
            return Date.UTC(y, m - 1, d) / 1000;
        }

        function gristDateToISO(v) {
            if (!v) return '?';
            const d = new Date(v * 1000);
            return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
        }

        function showStatus(msg, type) {
            const e = document.getElementById('status');
            e.textContent = msg; e.className = type || '';
            e.style.display = type ? 'block' : 'none';
        }

        let toastTimer;
        function showToast(msg, type) {
            const e = document.getElementById('toast');
            e.textContent = msg;
            e.className = (type === 'success' ? 'success' : 'error') + ' show';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => e.classList.remove('show'), 3500);
        }
    </script>
</body>

</html>
